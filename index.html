<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ── Top Bar ─────────────────────────────────────────────── -->
  <header class="topbar">
    <h1 class="app-title">Life Dashboard</h1>
    <button id="theme-toggle" aria-label="Toggle dark / light mode">☀</button>
  </header>

  <!-- ── Main Dashboard ─────────────────────────────────────── -->
  <main class="dashboard">

    <!-- Greeting Card -->
    <section class="card greeting-card" id="greeting-section">
      <div class="greeting-time-block">
        <p id="greeting-time">--:--</p>
        <p id="greeting-date">---</p>
      </div>
      <div class="greeting-text-block">
        <p id="greeting-text">Good morning!</p>
        <div class="name-editor">
          <span id="display-name"></span>
          <button id="edit-name-btn" aria-label="Edit name">✏</button>
          <input
            id="name-input"
            type="text"
            placeholder="Your name"
            aria-label="Enter your name"
            maxlength="40"
            class="hidden"
          />
          <button id="save-name-btn" class="hidden">Save</button>
        </div>
      </div>
    </section>

    <!-- Grid Row: Focus Timer + To-Do List -->
    <div class="grid-row">

      <!-- Focus Timer Card -->
      <section class="card timer-card" id="timer-section">
        <h2>Focus Timer</h2>
        <div class="timer-display" id="timer-display" aria-live="polite" aria-label="Timer countdown">25:00</div>
        <div class="timer-controls">
          <button id="timer-start" aria-label="Start timer">Start</button>
          <button id="timer-stop" aria-label="Pause timer">Stop</button>
          <button id="timer-reset" aria-label="Reset timer">Reset</button>
        </div>
      </section>

      <!-- To-Do List Card -->
      <section class="card todo-card" id="todo-section">
        <h2>Tasks</h2>
        <div class="todo-input-row">
          <input
            id="task-input"
            type="text"
            placeholder="Add a task…"
            aria-label="New task text"
            maxlength="200"
          />
          <button id="task-add-btn" aria-label="Add task">Add</button>
        </div>
        <p class="error-msg" id="task-error" role="alert" aria-live="polite"></p>
        <ul id="task-list" aria-label="Task list"></ul>
      </section>

    </div><!-- /.grid-row -->

    <!-- Quick Links Card -->
    <section class="card links-card" id="links-section">
      <h2>Quick Links</h2>
      <div class="links-input-row">
        <input
          id="link-label-input"
          type="text"
          placeholder="Label (e.g. GitHub)"
          aria-label="Link label"
          maxlength="60"
        />
        <input
          id="link-url-input"
          type="url"
          placeholder="https://…"
          aria-label="Link URL"
          maxlength="500"
        />
        <button id="link-add-btn" aria-label="Add quick link">Add Link</button>
      </div>
      <div id="links-container" aria-label="Quick links"></div>
    </section>

  </main><!-- /.dashboard -->

  <script src="js/script.js"></script>
</body>
</html>
